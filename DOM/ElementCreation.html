<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node List Creation</title>
</head>
<body>
    
</body>
<script>

    const div = document.createElement('div') // use to create new elements (tag)
    console.log(div)
    //Manipulation
    div.className="main"
    div.id=Math.round(Math.random()*10+1)
    div.setAttribute("title","generated Title")
    div.style.backgroundColor="green"
    //div.innerText="Pratik"
    const addText = document.createTextNode("Pratik")// create actul item
    div.appendChild(addText) // it is append child and add in element
    document.body.appendChild(div) // now shows on webpage 

</script>
</html>
