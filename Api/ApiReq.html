<body>
    <script>
    const xhr = new XMLHttpRequest();//it is a class that is used to create an XMLHttpRequest object. which is allows to send Http request
   const reqUrl ='https://api.github.com/users/hiteshchoudhary'
    xhr.open('GET',reqUrl)//using this we send request to the server and it takes two parameters one is request type and second is url(api)
    xhr.onreadystatechange = function(){ //
           console.log(xhr.readyState) // readyState 
           if (xhr.readyState === 4){
           const data = JSON.parse(this.responseText); //
           console.log(data.followers)

           }
    }
   
    xhr.send()
    </script>
