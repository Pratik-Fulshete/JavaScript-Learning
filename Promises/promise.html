<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
</head>
<body>
    <script>
        //promise 1
        //promise creation 
        //promise is a object that is used to haandle async task and it is used to handle future value
        const promise1 = new Promise(function(resolve,reject){
            //do all async takes  time to complete
            //DB call , crypto call,API call, file read
            setTimeout(()=>{
                console.log("Async task 1 is complete")
                resolve()
            },1000)
        })

        //promise consumtion

        promise1.then(function(){
            console.log("Promise consumed")
        })
    //promise 2
        new Promise((resolve,reject)=>{
            setTimeout(()=>{
                console.log("async task 2 is complete")
            },2000)
            resolve()
        }).then((value)=>{
              console.log("promise 2 consumed")
        }) 
//promise 3
//Data consumption
 const promise3 = new Promise(function(resolve,reject){
    setTimeout(function(){
        resolve({userName:"Pratik",userAge:23})
    },1000)
 })
 promise3.then((data)=>{
    console.log("promise 3 consumed", data)
 })
        
    </script>
</body>
</html>
