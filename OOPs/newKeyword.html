<body>
    <h1>new keyword :-</h1>
    <p>
       1: Js is a prototype behavioral lang. 
       2: Every object in Js has a prototype, which is another object that serves as a template for creating new objects.
        ex: Array ->Object -> null
            string -> Object -> null
            function -> Object -> null


    </p>
</body>
<script>
    function multiplyBy5(num){
        this.num = num;
        return num*5;
    }
     multiplyBy5.power =2
     console.log(multiplyBy5(5))
     console.log(multiplyBy5.power)
     console.log(multiplyBy5.prototype)
    function createUser(userName, score){
        this.userName =userName;
        this.score=score;    

    }
    createUser.prototype.increment = function(){
        this.score++;
    }
     const chai = new createUser("chai",25)//imp of new keyword in js if not use then it will return undefined error
     const tea = new createUser("tea",300)
     createUser.prototype.printScore = function(){
        console.log(`name is ${this.userName} and score is ${this.score}`)
     }
     chai.printScore()
</script>
