<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Key</title>
</head>
<body>
    <div class="project">
        <div id="insert">
            <div class="key">
                Press Key and Watch Magic
            </div>
        </div>
    </div>
    <script >
        const insert = document.getElementById('insert')
        window.addEventListener('keydown', (e)=>{
        insert.innerHTML=`
        <div class='color'>
            <table>
  <tr>
    <th>Key</th>
    <th>KeyCode</th>
    <th>Code</th>
  </tr>
  <tr>
    <td>${e.key === ' '?'Space':e.key}</td>
    <td>${e.keyCode}</td>
    <td>${e.code}</td>
  </tr>
  
</table>
            </div>
        `
        })
    </script>
</body>
</html>
